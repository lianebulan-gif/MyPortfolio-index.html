<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Liane D. Bulan</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="contact-page">

    <nav class="navbar">
        <div class="logo">Liane D. Bulan</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="skills.html">Skills</a></li>
            <li><a href="lesson.html">Gallery</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <main class="contact-wrapper">
        <div class="contact-card">
            <h1 class="page-title">Contact Me 📧</h1>
            <p class="subtitle">I'd love to hear from you! Send me a message below.</p>

            <div class="my-info">
                <p><strong>Email:</strong> lianedbulan@email.com</p>
                <p><strong>Location:</strong> Mariveles, Bataan</p>
            </div>

            <form id="contactForm">
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name">
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>

                <div class="input-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" rows="5" placeholder="Write your message here..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message ✨</button>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Iwasan ang pag-refresh ng page

            // Kunin ang values
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('message').value.trim();

            // 1. Validation Logic
            if (name === "" || email === "" || message === "") {
                alert("⚠️ Oops! Please fill in all the fields (Name, Email, and Message) before submitting.");
            } else {
                // 2. Acknowledge Receipt Dialog
                alert("✅ Thank you, " + name + "!\n\nYour message has been received. I will get back to you at " + email + " soon.");
                
                // Clear the form after success
                document.getElementById('contactForm').reset();
            }
        });
    </script>

</body>
</html>
